name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Device, iOS and app version
      placeholder: iPhone 17 Pro · iOS 26.1 · Samla 1.0 (12)
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options: [Arabic, English]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or recordings
